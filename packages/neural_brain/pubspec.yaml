name: neural_brain
description: >
  Pure-Dart, on-device "neural brain" for the Personal Storage app: NLP (dates, entities,
  actions, checklists), bilingual concept ontology, static-embedding semantic search,
  hybrid ranking, knowledge-graph construction, clustering and force-directed layout.
  No Flutter or native dependencies - runs on mobile, web and the Dart VM.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.9.0

dependencies:
  collection: ^1.19.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0
